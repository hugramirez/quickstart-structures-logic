    "ipykernel>=7.3.0",
    "matplotlib>=3.10.9",
    "pandas>=3.0.3",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.5.8",
]

[tool.uv]
default-groups = ["dev"]
